name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (egui/wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev \
            libudev-dev libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin foundations-map --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundations-map-linux-x86_64
          path: target/release/foundations-map
          if-no-files-found: error

  build-windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin foundations-map --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundations-map-windows-x86_64
          path: target/release/foundations-map.exe
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/foundations-map-linux-x86_64/foundations-map release/foundations-map-linux-x86_64
          cp artifacts/foundations-map-windows-x86_64/foundations-map.exe release/foundations-map-windows-x86_64.exe
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
