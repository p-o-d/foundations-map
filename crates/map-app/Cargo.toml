[package]
name = "map-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "foundations-map"
path = "src/main.rs"

[dependencies]
map-domain = { path = "../map-domain" }
map-io = { path = "../map-io" }
eframe = { version = "0.34.2", features = ["wgpu"] }
egui = "0.34.2"
glam = "0.32.1"
bytemuck = { version = "1", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
